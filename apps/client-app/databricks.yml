bundle:
  name: client-app

resources:
  apps:
    client-app:
      name: "client-app"
      description: "Client App — Connectors, LLM Providers, Agents, Access Control (architecture.drawio page 2)"
      source_code_path: .
      # Confirmed real by testing: without this, the forwarded user token
      # (X-Forwarded-Access-Token) only carries iam.access-control:read and
      # iam.current-user:read — not enough to run SQL or call a serving
      # endpoint as the employee. These two scopes are what the Agents
      # module's OBO path actually needs.
      user_api_scopes:
        - sql
        - serving.serving-endpoints

targets:
  default:
    default: true
